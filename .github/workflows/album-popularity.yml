name: Refresh VINYYLE album popularity
on:
  workflow_dispatch:
  schedule:
    - cron: '20 7 * * 0'
permissions:
  contents: write
jobs:
  popularity:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh measured album popularity
        run: python scripts/refresh_popularity.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/albums.json
          git diff --cached --quiet || (git commit -m "Refresh VINYYLE ListenBrainz popularity" && git push)
